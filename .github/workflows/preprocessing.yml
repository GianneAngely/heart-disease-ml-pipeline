name: Automated Preprocessing

on:
  push:
    branches:
      - main
    paths:
      - 'heart_disease_raw/**'
      - 'preprocessing/automate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocessing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r preprocessing/requirements.txt

      - name: Run preprocessing script
        run: |
          python preprocessing/automate.py

      - name: Upload preprocessed dataset
        uses: actions/upload-artifact@v4
        with:
          name: heart_disease_preprocessing
          path: preprocessing/heart_disease_preprocessing/

      - name: Commit preprocessed data to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add preprocessing/heart_disease_preprocessing/
          git diff --staged --quiet || git commit -m "ci: update preprocessed dataset [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
